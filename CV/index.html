<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="38cb683a-a04f-48ca-8747-b9faac3a13dc"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV – David Ceraso</title>
    <meta name="description" content="Curriculum vitae of David Ceraso – Product Design Manager at The Walt Disney Company.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/CV/cv-public.css?v=6">
    <link rel="stylesheet" href="/assets/site-grid-overlay.css">
    <style>
        .cv-back,
        .cv-public-root {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="grid-overlay" aria-hidden="true"></div>
    <a href="/resources/" class="cv-back">← Back</a>
    <main id="cv-root" class="cv-public-root" aria-busy="true">Loading…</main>
    <script src="/CV/cv-export.js?v=36" defer></script>
    <script>
        fetch('/CV/cv-content.html')
            .then((response) => {
                if (!response.ok) throw new Error('failed');
                return response.text();
            })
            .then((html) => {
                const root = document.getElementById('cv-root');
                root.innerHTML = html;
                root.removeAttribute('aria-busy');
                document.dispatchEvent(new CustomEvent('cv-letter-fit', { detail: { root } }));
            })
            .catch(() => {
                document.getElementById('cv-root').innerHTML =
                    '<p>Could not load CV. <a href="/CV/DavidCeraso_CV.pdf">Download PDF</a>.</p>';
                document.getElementById('cv-root').removeAttribute('aria-busy');
            });
    </script>
    <script src="/assets/site-grid-overlay.js" defer></script>
</body>
</html>
