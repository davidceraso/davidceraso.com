<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="38cb683a-a04f-48ca-8747-b9faac3a13dc"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Portfolio – David Ceraso</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/CV/cv-public.css?v=6">
    <style>
        @font-face {
            font-family: 'Replica Pro';
            src: url('/Replica/ReplicaProRegular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Replica Pro';
            src: url('/Replica/ReplicaProLight.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --font-title: 'Replica Pro', system-ui, sans-serif;
            --font-body: 'Courier New', monospace;
            --grid-pad-x: 16px;
            --grid-pad-y: 16px;
            /* Overlay uses 12 cols → 3 major columns (0, 4, 8, 12); images span 2 */
            --grid-image-span: 8;
            --grid-image-total: 12;
            --case-study-content-width: calc(100% * var(--grid-image-span) / var(--grid-image-total));
            /* Solid tint matching segments th (3% blue on #f5f6ff), not transparent over gutter */
            --case-study-viz-surface-bg: #f5f6ff;
            --case-study-viz-header-bg: #eef0ff;
            --case-study-viz-header-bg: color-mix(in srgb, #0000ff 3%, var(--case-study-viz-surface-bg));
        }

        @media (min-width: 1024px) {
            :root {
                --grid-pad-x: 56px;
                --grid-pad-y: 28px;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.6;
            color: #0000FF;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.authenticated {
            display: block;
        }

        #grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: difference;
        }

        #grid-overlay svg {
            display: block;
            width: 100%;
            height: 100%;
            shape-rendering: crispEdges;
        }

        .password-form {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(100% - 48px, 420px);
            margin: 24px;
        }

        .password-row {
            display: flex;
            align-items: stretch;
            width: 100%;
            background: transparent;
        }

        .password-form input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 14px;
            border: none;
            outline: none;
            background: transparent;
            color: #0000FF;
        }

        .password-form input::placeholder {
            color: rgba(0, 0, 255, 0.45);
        }

        .password-form button {
            flex-shrink: 0;
            font-family: var(--font-body);
            font-size: 13px;
            letter-spacing: 0.02em;
            padding: 10px 14px;
            border: none;
            cursor: pointer;
            background: transparent;
            color: #0000FF;
        }

        .password-form button:hover {
            opacity: 0.55;
        }

        .password-form .error {
            color: #cc0000;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        #portfolio {
            display: none;
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        #portfolio.is-visible {
            display: block;
        }

        .project-menu {
            display: none;
            position: fixed;
            top: var(--grid-pad-y);
            left: var(--grid-pad-x);
            z-index: 3;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .project-menu.is-visible {
            display: flex;
            flex-direction: row;
            align-items: center;
            max-width: calc(100vw - var(--grid-pad-x) * 2);
        }

        .project-menu-toggle {
            font: inherit;
            color: #0000FF;
            background: transparent;
            border: none;
            width: 18px;
            height: 14px;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
        }

        .project-menu-toggle:hover {
            opacity: 0.55;
        }

        .project-menu-icon {
            position: relative;
            width: 18px;
            height: 14px;
            display: block;
        }

        .project-menu-icon span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: currentColor;
            transition: transform 0.2s ease, top 0.2s ease, opacity 0.2s ease;
        }

        .project-menu-icon span:nth-child(1) {
            top: 0;
        }

        .project-menu-icon span:nth-child(2) {
            top: 6px;
        }

        .project-menu-icon span:nth-child(3) {
            top: 12px;
        }

        .project-menu-toggle[aria-expanded="true"] .project-menu-icon span:nth-child(1) {
            top: 6px;
            transform: rotate(45deg);
        }

        .project-menu-toggle[aria-expanded="true"] .project-menu-icon span:nth-child(2) {
            opacity: 0;
        }

        .project-menu-toggle[aria-expanded="true"] .project-menu-icon span:nth-child(3) {
            top: 6px;
            transform: rotate(-45deg);
        }

        .project-menu-list {
            list-style: none;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 0;
            margin: 0 0 0 14px;
            padding: 0;
            min-width: 0;
            background: transparent;
        }

        .project-menu-list li {
            display: inline-flex;
            align-items: center;
        }

        .project-menu-list li:not(:last-child)::after {
            content: "·";
            margin: 0 10px;
            color: rgba(0, 0, 255, 0.42);
            pointer-events: none;
            user-select: none;
        }

        .project-menu-list[hidden] {
            display: none;
        }

        .project-menu-list button {
            display: inline-block;
            width: auto;
            text-align: left;
            font: inherit;
            font-size: 12px;
            color: #0000FF;
            background: transparent;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            white-space: nowrap;
        }

        .project-menu-list button:hover {
            opacity: 0.55;
        }

        .project-menu-list button.is-active {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .project-panel {
            display: none;
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding: calc(var(--grid-pad-y) + 44px) var(--grid-pad-x) 24px;
        }

        .project-panel.is-active {
            display: block;
        }

        .case-study {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: none;
            font-family: var(--font-body);
            font-size: 14px;
            line-height: 1.6;
            color: #0000ff;
            font-variant-numeric: tabular-nums;
            background: transparent;
        }

        .case-study__eyebrow,
        .case-study__title,
        .case-study__lede,
        .case-study__hero p,
        .case-study__meta,
        .case-study__section h2,
        .case-study__section p,
        .case-study__list,
        .case-study__stats {
            max-width: var(--case-study-content-width);
        }

        .case-study__hero {
            margin-bottom: 0;
        }

        .case-study__hero + .case-study__section {
            margin-top: 40px;
        }

        .case-study__eyebrow {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(0, 0, 255, 0.5);
            margin-bottom: 10px;
        }

        .case-study__title {
            font-family: var(--font-title);
            font-size: clamp(26px, 4vw, 36px);
            font-weight: 400;
            line-height: 1.12;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
            color: #0000ff;
        }

        .case-study__lede {
            font-size: 14px;
            line-height: 1.65;
            margin-bottom: 24px;
            color: rgba(0, 0, 255, 0.88);
        }

        .case-study__meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 28px;
            margin-bottom: 32px;
            font-size: 12px;
            line-height: 1.5;
        }

        .case-study__meta dt {
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(0, 0, 255, 0.45);
            margin-bottom: 3px;
        }

        .case-study__meta dd {
            margin: 0;
            color: rgba(0, 0, 255, 0.92);
        }

        .case-study__meta .case-study__link {
            margin-top: 0;
            font-size: inherit;
        }

        .case-study__section {
            margin-bottom: 40px;
        }

        .case-study__section:last-child {
            margin-bottom: 0;
        }

        .case-study__section h2 {
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #0000ff;
            margin-bottom: 0;
        }

        .case-study__section h2 + p,
        .case-study__section h2 + .case-study__list,
        .case-study__section h2 + .case-study__figure,
        .case-study__section h2 + .case-study__gallery,
        .case-study__section h2 + .case-study__stats {
            margin-top: 10px;
        }

        .case-study__section h3.case-study__step {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(0, 0, 255, 0.72);
            margin-top: 28px;
            margin-bottom: 0;
        }

        .case-study__section h3.case-study__step + p,
        .case-study__section h3.case-study__step + figure,
        .case-study__section h3.case-study__step + .case-study__gallery,
        .case-study__section h3.case-study__step + .case-study__figure {
            margin-top: 10px;
        }

        .case-study__section p {
            font-size: inherit;
            line-height: 1.65;
            margin-bottom: 0;
            color: rgba(0, 0, 255, 0.88);
        }

        .case-study__section p + p {
            margin-top: 12px;
        }

        .case-study__section p + .case-study__list {
            margin-top: 20px;
        }

        /* ~20px after body copy → figure (incl. DXC preview), viz, or gallery */
        .case-study__section p + .case-study__figure,
        .case-study__section p + .case-study__dxc-preview,
        .case-study__section p + .case-study__theme-viz,
        .case-study__section p + .case-study__gallery {
            margin-top: 20px;
        }

        .case-study__section .case-study__list + .case-study__stats {
            margin-top: 24px;
        }

        .case-study__list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .case-study__list li {
            position: relative;
            padding-left: 14px;
            margin-bottom: 0;
            font-size: inherit;
            line-height: 1.65;
            color: rgba(0, 0, 255, 0.88);
        }

        .case-study__list li + li {
            margin-top: 10px;
        }

        .case-study__list li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: rgba(0, 0, 255, 0.4);
        }

        .case-study__nowrap {
            white-space: nowrap;
        }

        .case-study__stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px 28px;
            margin-top: 4px;
        }

        @media (min-width: 720px) {
            .case-study__stats {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .case-study__stat-value {
            font-family: var(--font-title);
            font-size: 20px;
            font-weight: 300;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            color: #0000ff;
        }

        .case-study__stat-label {
            font-size: 11px;
            line-height: 1.45;
            letter-spacing: 0.02em;
            color: rgba(0, 0, 255, 0.5);
        }

        .case-study__link {
            display: inline;
            margin-top: 0;
            font-size: inherit;
            color: #0000ff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .case-study__section p > .case-study__link {
            display: inline-block;
            margin-top: 12px;
            font-size: 13px;
        }

        .case-study__link:hover {
            opacity: 0.55;
        }

        .case-study__theme-viz {
            position: relative;
            z-index: 3;
            isolation: isolate;
            margin-top: 20px;
            width: var(--case-study-content-width);
            max-width: var(--case-study-content-width);
            padding: 16px 14px 18px;
            border: 1px solid rgba(0, 0, 255, 0.14);
            /* Opaque tint — same read as rgba(0, 0, 255, 0.02) on white, blocks layout grid */
            background-color: #f5f6ff;
            color: rgba(0, 0, 255, 0.88);
            font-variant-numeric: tabular-nums;
        }

        .case-study__theme-viz__title {
            font-family: var(--font-body);
            font-size: 11px;
            line-height: 1.4;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(0, 0, 255, 0.55);
            margin-bottom: 12px;
        }

        .case-study__theme-viz__legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 11px;
            line-height: 1.35;
            color: rgba(0, 0, 255, 0.65);
            margin-bottom: 14px;
        }

        .case-study__theme-viz__legend span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .case-study__theme-viz__legend i {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            font-style: normal;
            flex-shrink: 0;
        }

        .case-study__theme-viz__legend i.theme-viz__dot--pub {
            border: 1.5px solid rgba(0, 0, 255, 0.45);
            background: #f5f6ff;
        }

        .case-study__theme-viz__legend i.theme-viz__dot--adv {
            background: #0000ff;
        }

        .case-study__theme-viz__axis {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(0, 0, 255, 0.45);
            margin-bottom: 16px;
        }

        .case-study__theme-viz__axis-line {
            position: relative;
            height: 1px;
            background: rgba(0, 0, 255, 0.12);
        }

        .case-study__theme-viz__axis-line::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            width: 6px;
            height: 6px;
            border-top: 1px solid rgba(0, 0, 255, 0.25);
            border-right: 1px solid rgba(0, 0, 255, 0.25);
            transform: translateY(-50%) rotate(45deg);
        }

        .case-study__theme-viz__grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 22px;
        }

        @media (min-width: 720px) {
            .case-study__theme-viz__grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0 18px;
            }

            .theme-viz__facet + .theme-viz__facet {
                border-left: 1px solid rgba(0, 0, 255, 0.1);
                padding-left: 18px;
            }
        }

        .theme-viz__facet-title {
            font-family: var(--font-title);
            font-size: 12px;
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: -0.01em;
            color: #0000ff;
            margin-bottom: 12px;
            min-height: 2.7em;
        }

        .theme-viz__rows {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .theme-viz__row {
            --pub: 20%;
            --adv: 90%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        .theme-viz__label {
            font-size: 10px;
            line-height: 1.35;
            letter-spacing: 0.01em;
            color: rgba(0, 0, 255, 0.72);
        }

        .theme-viz__track {
            position: relative;
            height: 14px;
            background: rgba(0, 0, 255, 0.06);
            border: none;
            border-radius: 2px;
        }

        .theme-viz__track::before {
            content: "";
            position: absolute;
            left: var(--pub);
            width: calc(var(--adv) - var(--pub));
            top: 50%;
            height: 1.5px;
            background: rgba(0, 0, 255, 0.45);
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .theme-viz__span {
            display: none;
        }

        .theme-viz__point {
            position: absolute;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .theme-viz__point--pub {
            left: var(--pub);
            border: 1.5px solid rgba(0, 0, 255, 0.55);
            background: #f5f6ff;
        }

        .theme-viz__point--adv {
            left: var(--adv);
            background: #0000ff;
            border: 1.5px solid #0000ff;
        }

        .case-study__theme-viz__note {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 0, 255, 0.08);
            font-size: 10px;
            line-height: 1.45;
            color: rgba(0, 0, 255, 0.42);
        }

        .case-study__theme-viz .case-study__sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .case-study__section .case-study__theme-viz + .case-study__theme-viz {
            margin-top: 24px;
        }

        /* Mid-market advertiser needs (deck slide 72) */
        .midmarket-viz__scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -1px;
        }

        .midmarket-viz__grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(152px, 1fr));
            gap: 0;
            min-width: 760px;
            border: 1px solid rgba(0, 0, 255, 0.12);
            background: var(--case-study-viz-surface-bg);
        }

        .midmarket-viz__col {
            padding: 12px 11px 14px;
            border-left: 1px solid rgba(0, 0, 255, 0.08);
            background: var(--case-study-viz-surface-bg);
        }

        .midmarket-viz__col:first-child {
            border-left: none;
        }

        .midmarket-viz__persona {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.35;
            color: rgba(0, 0, 255, 0.92);
            margin: 0 0 10px;
            min-height: 2.65em;
        }

        .midmarket-viz__logos {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-start;
            gap: 8px 10px;
            min-height: 36px;
            margin-bottom: 12px;
            background: var(--case-study-viz-surface-bg);
        }

        .midmarket-viz__logos img {
            display: block;
            max-height: 26px;
            max-width: 88px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .midmarket-viz__logos img.midmarket-viz__logo--wordmark {
            max-height: 22px;
            max-width: 132px;
            mix-blend-mode: screen;
        }

        .case-study__section .case-study__midmarket-viz p.midmarket-viz__needs-label {
            font-size: 10px;
            line-height: 1.4;
            letter-spacing: normal;
            text-transform: none;
            color: rgba(0, 0, 255, 0.92);
            margin: 0 0 4px;
            white-space: nowrap;
        }

        .midmarket-viz__needs {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 9px;
            line-height: 1.45;
            color: rgba(0, 0, 255, 0.72);
        }

        .midmarket-viz__needs li {
            position: relative;
            padding-left: 9px;
            margin-bottom: 7px;
        }

        .midmarket-viz__needs li:last-child {
            margin-bottom: 0;
        }

        .midmarket-viz__needs li::before {
            content: "–";
            position: absolute;
            left: 0;
            color: rgba(0, 0, 255, 0.35);
        }

        /* Market opportunity matrix (deck slide 71) — 1px gutters, no doubled borders */
        .opportunity-viz__matrix {
            --opportunity-viz-y-width: calc(20px + 8px * 1.4);
            display: grid;
            grid-template-columns: var(--opportunity-viz-y-width) repeat(2, minmax(0, 1fr));
            grid-template-rows: auto repeat(2, minmax(0, 1fr));
            gap: 1px;
            border: 1px solid rgba(0, 0, 255, 0.08);
            background: rgba(0, 0, 255, 0.08);
            min-height: 220px;
        }

        .opportunity-viz__corner {
            background: var(--case-study-viz-header-bg);
            min-height: 0;
        }

        .opportunity-viz__x,
        .opportunity-viz__y {
            line-height: 1.4;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .opportunity-viz__x {
            padding: 10px 8px;
            min-height: 0;
        }

        .opportunity-viz__y {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 6px 2px;
            min-width: 0;
        }

        .opportunity-viz__cell {
            padding: 14px 12px 16px;
            background: var(--case-study-viz-surface-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-height: 96px;
        }

        .opportunity-viz__cell--focus {
            background: #0000ff;
            color: #ffffff;
        }

    <script>
        const PASSWORD_HASH = 'fcde242ae1f8e2afc85a96d';
        const ENCRYPTED_PATH = 'AwQRARMLSxFWFFAAVRNTEEwFX1AWVxdNFQgW';

        const PORTFOLIO_TITLE_BASE = 'David Ceraso Portfolio';
        const PROJECTS = [
            { id: 'cv', label: 'CV' },
            { id: 'abc-news-design-mcp', label: 'ABC News Design System MCP' },
            { id: 'disney-campaign-manager', label: 'Disney Campaign Manager' }
        ];

        /** Bump when `project-content.js` case studies change (cache-bust). */
        const PROJECT_CONTENT_REVISION = 62;
        const DCM_CONTENT_MARKER = 'Externalizing ad creation (DXC)';

        let PROJECT_CONTENT = { cv: '' };

        function refreshProjectContent() {
            const previousCv = PROJECT_CONTENT.cv;
            const cvRevision = PROJECT_CONTENT._cvRevision;
            PROJECT_CONTENT = Object.assign({ cv: previousCv || '' }, window.PORTFOLIO_PROJECT_CONTENT || {});
            if (cvRevision) {
                PROJECT_CONTENT._cvRevision = cvRevision;
            }
        }

        function loadProjectContentScript() {
            return new Promise((resolve, reject) => {
                const dcm = window.PORTFOLIO_PROJECT_CONTENT?.['disney-campaign-manager'];
                if (dcm && dcm.includes(DCM_CONTENT_MARKER)) {
                    resolve();
                    return;
                }

                const scriptId = 'portfolio-project-content';
                const existing = document.getElementById(scriptId);
                if (existing) {
                    existing.remove();
                }
                delete window.PORTFOLIO_PROJECT_CONTENT;

                const script = document.createElement('script');
                script.id = scriptId;
                script.src = 'project-content.js?v=' + PROJECT_CONTENT_REVISION;
                script.onload = () => {
                    const loaded = window.PORTFOLIO_PROJECT_CONTENT?.['disney-campaign-manager'];
                    if (loaded && loaded.includes(DCM_CONTENT_MARKER)) {
                        resolve();
                        return;
                    }
                    reject(new Error('project-content.js loaded but DCM case study is missing or outdated'));
                };
                script.onerror = () =>
                    reject(
                        new Error(
                            'Failed to load project-content.js — deploy it beside index.html or hard-refresh (Cmd+Shift+R).'
                        )
                    );
                document.head.appendChild(script);
            });
        }

        async function ensureProjectContent() {
            try {
                await loadProjectContentScript();
            } catch (error) {
                console.error('[portfolio] Project content failed to load.', error);
            }
            refreshProjectContent();
        }

        /** Bump when `/CV/cv-content.html` changes so portfolio refetches (in-memory + HTTP cache). */
        const CV_CONTENT_REVISION = 10;

        async function hydrateCvContent() {
            if (PROJECT_CONTENT.cv && PROJECT_CONTENT._cvRevision === CV_CONTENT_REVISION) {
                return;
            }

            try {
                const cvUrl = new URL('../CV/cv-content.html', window.location.href);
                cvUrl.searchParams.set('v', String(CV_CONTENT_REVISION));
                const response = await fetch(cvUrl.href, {
                    credentials: 'same-origin',
                    cache: 'no-store',
                });
                if (!response.ok) {
                    throw new Error('CV fetch failed');
                }
                const html = await response.text();
                PROJECT_CONTENT.cv = '<div class="case-study case-study--cv">' + html + '</div>';
                PROJECT_CONTENT._cvRevision = CV_CONTENT_REVISION;

                const cvPanel = document.getElementById('project-cv');
                if (cvPanel) {
                    cvPanel.innerHTML = PROJECT_CONTENT.cv;
                }
            } catch (error) {
                PROJECT_CONTENT.cv =
                    '<article class="case-study"><p class="case-study__lede">Could not load CV text. <a class="case-study__link" href="/CV/DavidCeraso_CV.pdf" target="_blank" rel="noopener noreferrer">Download PDF</a>.</p></article>';
                PROJECT_CONTENT._cvRevision = CV_CONTENT_REVISION;
            }
        }

        const passwordForm = document.getElementById('passwordForm');
        const portfolio = document.getElementById('portfolio');
        const projectMenu = document.getElementById('projectMenu');
        const projectMenuToggle = document.getElementById('projectMenuToggle');
        const projectMenuList = document.getElementById('projectMenuList');
        const portfolioTitle = document.getElementById('portfolioTitle');
        const passwordError = document.getElementById('passwordError');
        const passwordInput = document.getElementById('passwordInput');

        let activeProjectId = PROJECTS[0].id;

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex.substring(0, 23);
        }

        function decryptPath(password) {
            try {
                const encrypted = atob(ENCRYPTED_PATH);
                let result = '';
                for (let i = 0; i < encrypted.length; i++) {
                    result += String.fromCharCode(encrypted.charCodeAt(i) ^ password.charCodeAt(i % password.length));
                }
                return result;
            } catch (e) {
                return null;
            }
        }

        function renderProjectMenu() {
            projectMenuList.innerHTML = PROJECTS.map((project) =>
                '<li><button type="button" data-project-id="' + project.id + '">' + project.label + '</button></li>'
            ).join('');

            portfolio.innerHTML = PROJECTS.map((project) => {
                let content = PROJECT_CONTENT[project.id] || '';
                if (!content && project.id !== 'cv') {
                    content =
                        '<article class="case-study"><p class="case-study__lede">This project did not load. Ensure <code>portfolio/project-content.js</code> is deployed next to <code>index.html</code>, then hard-refresh (Cmd+Shift+R). Local preview: run <code>python3 -m http.server 8000</code> from the repo root and open <a class="case-study__link" href="/portfolio/">/portfolio/</a> (not the HTML file directly).</p></article>';
                }
                return '<section class="project-panel" id="project-' + project.id + '" data-project-id="' + project.id + '">' + content + '</section>';
            }).join('');

            projectMenuList.querySelectorAll('button[data-project-id]').forEach((button) => {
                button.addEventListener('click', () => {
                    setActiveProject(button.dataset.projectId);
                    closeProjectMenu();
                });
            });

            setActiveProject(activeProjectId);
            initCaseStudyFigureMats();
            playDxcPreviewVideos(document.getElementById('project-disney-campaign-manager'));
            syncOpportunityMatrixAxes(portfolio);
            document.dispatchEvent(
                new CustomEvent('cv-letter-fit', { detail: { root: document.getElementById('project-cv') } })
            );
        }

        /* Slide 1LgR2…/g3caec594e79_1_124 — chrome g3caec594e79_1_131 + Video+.png g3c4dc8115a6_0_5 */
        const DXC_PREVIEW_CHROME = { w: 2048, h: 1485, tv: { l: 133, t: 454, w: 1377, h: 772 } };

        const CASE_STUDY_FIGURE_MAT_PROJECTS = ['disney-campaign-manager', 'abc-news-design-mcp'];

        function initCaseStudyFigureMats() {
            CASE_STUDY_FIGURE_MAT_PROJECTS.forEach((id) => {
                wrapCaseStudyFigureMats(document.getElementById('project-' + id));
            });
        }

        function wrapCaseStudyFigureMats(root) {
            if (!root) {
                return;
            }
            root.querySelectorAll('.case-study__figure:not(.case-study__theme-viz)').forEach((figure) => {
                if (figure.querySelector(':scope > .case-study__figure-mat')) {
                    return;
                }
                const media =
                    figure.querySelector(':scope > img') ||
                    (figure.classList.contains('case-study__dxc-preview')
                        ? figure.querySelector(':scope > .dxc-preview__stage')
                        : null);
                if (!media) {
                    return;
                }
                const mat = document.createElement('div');
                mat.className = 'case-study__figure-mat';
                figure.insertBefore(mat, media);
                mat.appendChild(media);
            });
        }

        function syncOpportunityMatrixAxes(root) {
            if (!root) {
                return;
            }
            root.querySelectorAll('.opportunity-viz__matrix').forEach((matrix) => {
                const corner = matrix.querySelector('.opportunity-viz__corner');
                const xs = matrix.querySelectorAll('.opportunity-viz__x');
                let headerHeight = 0;
                if (corner) {
                    headerHeight = Math.max(headerHeight, corner.getBoundingClientRect().height);
                }
                xs.forEach((el) => {
                    headerHeight = Math.max(headerHeight, el.getBoundingClientRect().height);
                });
                if (headerHeight > 0) {
                    matrix.style.setProperty('--opportunity-viz-y-width', `${Math.round(headerHeight)}px`);
                }
            });
        }

        function calibrateDxcPreviewStages(root) {
            if (!root) {
                return;
            }
            const { w: baseW, h: baseH, tv } = DXC_PREVIEW_CHROME;
            root.querySelectorAll('.dxc-preview__stage').forEach((stage) => {
                const chrome = stage.querySelector('.dxc-preview__chrome');
                const screen = stage.querySelector('.dxc-preview__screen');
                if (!chrome || !screen) {
                    return;
                }
                const apply = () => {
                    if (!chrome.naturalWidth || !chrome.naturalHeight) {
                        return;
                    }
                    screen.style.left = `${(tv.l / baseW) * 100}%`;
                    screen.style.top = `${(tv.t / baseH) * 100}%`;
                    screen.style.width = `${(tv.w / baseW) * 100}%`;
                    screen.style.height = `${(tv.h / baseH) * 100}%`;
                };
                if (chrome.complete) {
                    apply();
                } else {
                    chrome.addEventListener('load', apply, { once: true });
                }
            });
        }

        function playDxcPreviewVideos(root) {
            if (!root) {
                return;
            }
            calibrateDxcPreviewStages(root);
            root.querySelectorAll('.dxc-preview__video').forEach((video) => {
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                const start = () => {
                    const attempt = video.play();
                    if (attempt && typeof attempt.catch === 'function') {
                        attempt.catch(() => {});
                    }
                };
                if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    start();
                } else {
                    video.addEventListener('loadeddata', start, { once: true });
                }
            });
        }

        function setActiveProject(projectId) {
            if (!PROJECTS.some((project) => project.id === projectId)) {
                return;
            }

            activeProjectId = projectId;
            sessionStorage.setItem('portfolio_project', projectId);

            projectMenuList.querySelectorAll('button[data-project-id]').forEach((button) => {
                button.classList.toggle('is-active', button.dataset.projectId === projectId);
            });

            portfolio.querySelectorAll('.project-panel').forEach((panel) => {
                panel.classList.toggle('is-active', panel.dataset.projectId === projectId);
            });

            window.scrollTo(0, 0);

            const project = PROJECTS.find((entry) => entry.id === projectId);
            portfolioTitle.textContent = PORTFOLIO_TITLE_BASE + ' – ' + (project ? project.label : '');

            if (projectId === 'cv') {
                document.dispatchEvent(
                    new CustomEvent('cv-letter-fit', { detail: { root: document.getElementById('project-cv') } })
                );
            }

            if (CASE_STUDY_FIGURE_MAT_PROJECTS.includes(projectId)) {
                wrapCaseStudyFigureMats(document.getElementById('project-' + projectId));
            }

            if (projectId === 'disney-campaign-manager') {
                const dcmRoot = document.getElementById('project-disney-campaign-manager');
                playDxcPreviewVideos(dcmRoot);
                syncOpportunityMatrixAxes(dcmRoot);
            }
        }

        window.addEventListener('resize', () => {
            syncOpportunityMatrixAxes(document.getElementById('project-disney-campaign-manager'));
        });

        function openProjectMenu() {
            projectMenuToggle.setAttribute('aria-expanded', 'true');
            projectMenuList.hidden = false;
        }

        function closeProjectMenu() {
            projectMenuToggle.setAttribute('aria-expanded', 'false');
            projectMenuList.hidden = true;
        }

        function toggleProjectMenu() {
            if (projectMenuList.hidden) {
                openProjectMenu();
            } else {
                closeProjectMenu();
            }
        }

        async function showPortfolio() {
            sessionStorage.setItem('portfolio_auth', 'true');
            passwordForm.style.display = 'none';
            document.body.classList.add('authenticated');
            portfolio.hidden = false;
            portfolio.classList.add('is-visible');
            projectMenu.hidden = false;
            projectMenu.classList.add('is-visible');
            portfolioTitle.classList.add('is-visible');

            const savedProject = sessionStorage.getItem('portfolio_project');
            if (savedProject && PROJECTS.some((project) => project.id === savedProject)) {
                activeProjectId = savedProject;
            }

            await ensureProjectContent();
            await hydrateCvContent();
            renderProjectMenu();
        }

        projectMenuToggle.addEventListener('click', toggleProjectMenu);

        document.addEventListener('click', (event) => {
            if (!projectMenu.classList.contains('is-visible')) {
                return;
            }

            if (!projectMenu.contains(event.target)) {
                closeProjectMenu();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeProjectMenu();
            }
        });

        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value;
            const hash = await hashPassword(password);

            if (hash === PASSWORD_HASH) {
                const path = decryptPath(password);
                if (path && path.startsWith('secure/')) {
                    passwordError.style.display = 'none';
                    showPortfolio();
                } else {
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } else {
                passwordError.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        if (sessionStorage.getItem('portfolio_auth') === 'true') {
            showPortfolio();
        }

        const gridOverlay = document.getElementById('grid-overlay');

        function drawGridOverlay() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const rootStyles = getComputedStyle(document.documentElement);
            const padding = parseFloat(rootStyles.getPropertyValue('--grid-pad-x')) || 16;
            const scaleY = height / 1080;
            const contentWidth = width - padding * 2;
            const columnWidth = contentWidth / 12;
            const verticalPositions = [0, 4, 8, 12].map((column) => padding + column * columnWidth);

            const rowBands = [
                [0, 348 * scaleY],
                [372 * scaleY, 720 * scaleY],
                [744 * scaleY, height]
            ];
            const horizontalLines = [360 * scaleY, 732 * scaleY];
            const horizontalInset = 12;

            let verticalPaths = '';
            rowBands.forEach(([top, bottom]) => {
                verticalPositions.forEach((x) => {
                    verticalPaths += 'M' + x + ' ' + top + 'V' + bottom;
                });
            });

            let horizontalPaths = '';
            horizontalLines.forEach((y) => {
                horizontalPaths +=
                    'M0 ' + y + 'H' + (padding - horizontalInset) +
                    'M' + (padding + horizontalInset) + ' ' + y + 'H' + (padding + columnWidth * 4 - horizontalInset) +
                    'M' + (padding + columnWidth * 4 + horizontalInset) + ' ' + y + 'H' + (padding + columnWidth * 8 - horizontalInset) +
                    'M' + (padding + columnWidth * 8 + horizontalInset) + ' ' + y + 'H' + (padding + columnWidth * 12 - horizontalInset) +
                    'M' + (padding + columnWidth * 12 + horizontalInset) + ' ' + y + 'H' + width;
            });

            let crosshairPaths = '';
            horizontalLines.forEach((y) => {
                verticalPositions.forEach((x) => {
                    crosshairPaths +=
                        'M' + x + ' ' + (y - 6) + 'V' + (y + 6) +
                        'M' + (x - 6) + ' ' + y + 'H' + (x + 6);
                });
            });

            gridOverlay.innerHTML =
                '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">' +
                    '<path d="' + verticalPaths + '" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" fill="none"></path>' +
                    '<path d="' + horizontalPaths + '" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" fill="none"></path>' +
                    '<path d="' + crosshairPaths + '" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.4"></path>' +
                '</svg>';
        }

        drawGridOverlay();
        window.addEventListener('resize', () => {
            drawGridOverlay();
            if (activeProjectId === 'cv') {
                document.dispatchEvent(
                    new CustomEvent('cv-letter-fit', { detail: { root: document.getElementById('project-cv') } })
                );
            }
        });

    </script>
